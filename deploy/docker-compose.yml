# Production infra on the Hetzner VPS. Localhost-only ports from the 478x
# block reserved for gusto (4780 = Postgres, 4783 = API, 4782 = Redis).
services:
  postgres:
    image: postgres:17-alpine
    container_name: gusto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gusto
      # GUSTO_DB_PASSWORD lives in /opt/gusto/.env on the server (generated on first deploy).
      POSTGRES_PASSWORD: ${GUSTO_DB_PASSWORD:?set in /opt/gusto/.env}
      POSTGRES_DB: gusto
    ports:
      - '127.0.0.1:4780:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gusto-redis
    restart: unless-stopped
    # AOF so delayed BullMQ jobs survive a container restart.
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:4782:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
